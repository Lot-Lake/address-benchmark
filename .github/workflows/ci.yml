name: conformance
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  authored-suite:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test offline authored contracts and end-to-end runs
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Package smoke test
        run: |
          python -m pip install --no-deps .
          address-benchmark conform demo
          address-benchmark validate examples/corpora/us-core/manifest.json
      - name: Frozen local-only synthetic plan and publishable export
        env:
          PYTHONPATH: src
        run: |
          python tools/prepare_scoped_example.py "$RUNNER_TEMP/scoped-plan"
          python -m address_benchmark freeze-plan "$RUNNER_TEMP/scoped-plan/plan.json"
          python -m address_benchmark run-plan "$RUNNER_TEMP/scoped-plan/plan.json" --json
          python -m address_benchmark verify "$RUNNER_TEMP/scoped-plan/execution"
          python -m address_benchmark report "$RUNNER_TEMP/scoped-plan/plan.json" --publishable --format json --out "$RUNNER_TEMP/scoped-aggregate.json"
      - name: Add an engine through verified accuracy reuse
        env:
          PYTHONPATH: src
        run: |
          python tools/prepare_reuse_example.py "$RUNNER_TEMP/reuse-plan"
          python -m address_benchmark run-plan "$RUNNER_TEMP/reuse-plan/prior/plan.json" --json
          python -m address_benchmark run-plan "$RUNNER_TEMP/reuse-plan/expanded/plan.json" --reuse "$RUNNER_TEMP/reuse-plan/prior/plan.json" --json
          python -m address_benchmark verify "$RUNNER_TEMP/reuse-plan/expanded/run"
          python -c 'import json,os,pathlib; r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"reuse-plan/expanded/run/run.json").read_text()); assert r["reuse"]["demo"]["status"] == "reused"; assert r["reuse"]["refusal"]["status"] == "fresh"'
